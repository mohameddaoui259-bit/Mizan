<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مِيزان — إدارة محل المواد الغذائية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --bg: #EEF2E7;
    --surface: #FFFFFF;
    --surface-soft: #F5F7F0;
    --ink: #1E2A19;
    --ink-muted: #5B6B54;
    --line: #D8E0CC;
    --olive: #435E3B;
    --olive-dark: #30431F;
    --saffron: #D9A441;
    --saffron-ink: #6B4A12;
    --brick: #B24B32;
    --brick-bg: #F7E4DD;
    --radius-card: 14px;
    --radius-pill: 999px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Tajawal',sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    font-size:15px;
  }
  ::selection{background:var(--saffron); color:var(--olive-dark);}

  /* ---------- Layout ---------- */
  #app{display:flex; width:100%; min-height:100vh;}

  #sidebar{
    width:220px;
    flex-shrink:0;
    background:var(--olive-dark);
    color:#EFF3E7;
    display:flex;
    flex-direction:column;
    padding:22px 14px;
  }
  .brand{
    font-weight:900;
    font-size:22px;
    padding:0 8px 22px 8px;
    display:flex;
    align-items:baseline;
    gap:6px;
    border-bottom:1px solid rgba(255,255,255,0.12);
    margin-bottom:16px;
  }
  .brand small{font-weight:400; font-size:12px; opacity:0.65;}
  nav{display:flex; flex-direction:column; gap:3px; flex:1;}
  .nav-btn{
    all:unset;
    cursor:pointer;
    padding:11px 12px;
    border-radius:10px;
    font-size:14.5px;
    font-weight:500;
    display:flex;
    align-items:center;
    gap:10px;
    color:#DCE6D2;
    transition:background .15s ease;
  }
  .nav-btn:hover{background:rgba(255,255,255,0.08);}
  .nav-btn.active{background:var(--saffron); color:var(--olive-dark); font-weight:700;}
  .nav-ico{width:18px; text-align:center; opacity:0.9;}
  .sidebar-foot{
    font-size:11.5px;
    color:rgba(255,255,255,0.4);
    padding:10px 8px 0 8px;
    border-top:1px solid rgba(255,255,255,0.12);
    margin-top:10px;
  }

  #main{flex:1; display:flex; flex-direction:column; min-width:0;}
  #topbar{
    padding:18px 28px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid var(--line);
    background:var(--surface);
  }
  #topbar h1{font-size:19px; margin:0; font-weight:700;}
  #topbar .date{font-size:13px; color:var(--ink-muted);}
  #content{padding:24px 28px; flex:1; overflow-y:auto;}

  /* ---------- Generic bits ---------- */
  .grid{display:grid; gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-2{grid-template-columns:1fr 1fr;}
  @media(max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;}}

  .stat-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-card);
    padding:16px 18px;
    border-inline-start:4px solid var(--olive);
  }
  .stat-card.saffron{border-inline-start-color:var(--saffron);}
  .stat-card.brick{border-inline-start-color:var(--brick);}
  .stat-card .label{font-size:12.5px; color:var(--ink-muted); margin-bottom:6px;}
  .stat-card .value{font-size:26px; font-weight:900;}
  .stat-card .sub{font-size:12px; color:var(--ink-muted); margin-top:4px;}

  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-card);
    padding:20px;
    margin-bottom:18px;
  }
  .panel h2{margin:0 0 14px 0; font-size:16px; font-weight:700;}
  .panel-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .panel-head h2{margin:0;}

  table{width:100%; border-collapse:collapse; font-size:14px;}
  th{
    text-align:start;
    font-size:12px;
    color:var(--ink-muted);
    font-weight:700;
    padding:8px 10px;
    border-bottom:2px solid var(--line);
  }
  td{padding:10px 10px; border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:var(--surface-soft);}

  .btn{
    all:unset;
    cursor:pointer;
    padding:9px 16px;
    border-radius:10px;
    font-weight:700;
    font-size:13.5px;
    background:var(--olive);
    color:#fff;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .btn:hover{background:var(--olive-dark);}
  .btn.ghost{background:transparent; color:var(--olive); border:1.5px solid var(--olive);}
  .btn.ghost:hover{background:var(--surface-soft);}
  .btn.danger{background:var(--brick);}
  .btn.danger:hover{background:#8f3a26;}
  .btn.small{padding:5px 10px; font-size:12px; border-radius:8px;}
  .btn.saffron{background:var(--saffron); color:var(--olive-dark);}

  .badge{
    display:inline-block;
    padding:3px 10px;
    border-radius:var(--radius-pill);
    font-size:11.5px;
    font-weight:700;
  }
  .badge.ok{background:#E4EEDB; color:var(--olive-dark);}
  .badge.low{background:var(--brick-bg); color:var(--brick);}

  input, select, textarea{
    font-family:'Tajawal',sans-serif;
    border:1.5px solid var(--line);
    border-radius:9px;
    padding:9px 12px;
    font-size:14px;
    background:var(--surface);
    color:var(--ink);
    width:100%;
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--saffron); border-color:var(--saffron);}
  label{font-size:12.5px; color:var(--ink-muted); font-weight:700; display:block; margin-bottom:5px;}
  .field{margin-bottom:12px;}

  .empty{
    text-align:center;
    padding:36px 20px;
    color:var(--ink-muted);
    font-size:14px;
  }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(30,42,25,0.45);
    display:flex; align-items:center; justify-content:center;
    z-index:50; padding:20px;
  }
  .modal{
    background:var(--surface); border-radius:16px; padding:24px;
    width:100%; max-width:420px; max-height:88vh; overflow-y:auto;
  }
  .modal h3{margin:0 0 16px 0; font-size:17px;}
  .modal-actions{display:flex; gap:8px; margin-top:18px;}
  .modal.wide{max-width:640px;}
  .add-item-row{display:grid; grid-template-columns:1fr 90px 110px 80px; gap:8px; align-items:end; margin-bottom:12px;}
  @media(max-width:560px){.add-item-row{grid-template-columns:1fr 1fr; grid-template-rows:auto auto;}}
  .mini-table{width:100%; border-collapse:collapse; font-size:13px; margin-bottom:10px;}
  .mini-table th{font-size:11px; padding:6px 6px; border-bottom:2px solid var(--line);}
  .mini-table td{padding:6px 6px; border-bottom:1px solid var(--line);}
  .summary-row{display:flex; justify-content:space-between; font-size:13.5px; padding:4px 0;}
  .summary-row.total{font-weight:900; font-size:16px; border-top:2px solid var(--line); margin-top:6px; padding-top:8px;}
  .summary-row.remaining{color:var(--brick); font-weight:700;}

  /* ---------- POS ---------- */
  .pos-wrap{display:grid; grid-template-columns:1fr 340px; gap:18px; align-items:start;}
  @media(max-width:900px){.pos-wrap{grid-template-columns:1fr;}}
  .pos-search{margin-bottom:14px;}
  .product-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  @media(max-width:700px){.product-grid{grid-template-columns:repeat(2,1fr);}}
  .product-tile{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:12px; cursor:pointer; text-align:center; transition:border-color .12s;
  }
  .product-tile:hover{border-color:var(--saffron);}
  .product-tile .pname{font-weight:700; font-size:13.5px; margin-bottom:4px;}
  .product-tile .pprice{color:var(--olive); font-weight:900; font-size:14px;}
  .product-tile .pstock{font-size:11px; color:var(--ink-muted); margin-top:3px;}
  .cart-box{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:16px; position:sticky; top:0;
  }
  .cart-item{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 0; border-bottom:1px solid var(--line);}
  .cart-item .ci-name{font-size:13px; font-weight:700; flex:1;}
  .qty-ctrl{display:flex; align-items:center; gap:6px;}
  .qty-ctrl button{
    all:unset; cursor:pointer; width:22px; height:22px; border-radius:6px;
    background:var(--surface-soft); text-align:center; font-weight:900; line-height:22px;
  }
  .cart-total{display:flex; justify-content:space-between; font-size:18px; font-weight:900; margin:14px 0;}
  .muted-note{font-size:11.5px; color:var(--ink-muted); margin-top:8px;}

  .cart-line{padding:9px 0; border-bottom:1px solid var(--line);}
  .cart-line-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .cart-line-top .ci-name{font-size:13px; font-weight:700; flex:1;}
  .cart-remove{all:unset; cursor:pointer; color:var(--brick); font-weight:900; font-size:15px; padding:0 4px;}
  .cart-line-mid{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:6px;}
  .qty-decimal{width:90px; text-align:center; padding:5px 6px; font-size:13px;}
  .cart-line-disc{display:flex; align-items:center; gap:6px; margin-top:6px;}
  .cart-line-disc input{width:70px; padding:5px 6px; font-size:12px;}
  .cart-line-disc select{width:auto; padding:5px 6px; font-size:12px;}
  .cart-line-disc label{margin:0; font-size:11px; white-space:nowrap;}
  .line-net{font-size:13px; font-weight:700;}
  .invoice-disc-row{display:flex; align-items:center; gap:6px; margin-bottom:10px;}
  .invoice-disc-row input{flex:1;}
  .invoice-disc-row select{width:auto;}
  .change-row{display:flex; justify-content:space-between; font-size:13.5px; font-weight:700; margin-top:6px;}
  .change-row.pay{color:var(--olive);}
  .change-row.owe{color:var(--brick);}

  .tabs{display:flex; gap:6px; margin-bottom:16px;}
  .tab-btn{
    all:unset; cursor:pointer; padding:8px 16px; border-radius:var(--radius-pill);
    font-size:13.5px; font-weight:700; background:var(--surface-soft); color:var(--ink-muted);
  }
  .tab-btn.active{background:var(--olive); color:#fff;}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--olive-dark); color:#fff; padding:12px 22px; border-radius:var(--radius-pill);
    font-size:13.5px; font-weight:700; z-index:100; box-shadow:0 6px 18px rgba(0,0,0,0.2);
  }

  /* ---------- مستخدم حالي ---------- */
  .user-switch{display:flex; align-items:center; gap:8px;}
  .user-switch select{width:auto; min-width:150px; padding:6px 10px; font-size:12.5px;}
  .role-tag{font-size:10.5px; padding:2px 8px; border-radius:var(--radius-pill); background:var(--surface-soft); color:var(--ink-muted); font-weight:700;}

  /* ---------- الديون ---------- */
  .debt-amount{font-weight:900; color:var(--brick);}
  .debt-row-clear{color:var(--olive); font-weight:700;}

  /* ---------- باركود POS ---------- */
  .barcode-row{display:flex; gap:8px; margin-bottom:10px;}
  .barcode-row input{flex:1;}

  .pay-toggle{display:flex; gap:8px; margin-bottom:12px;}
  .pay-toggle button{
    all:unset; cursor:pointer; flex:1; text-align:center; padding:9px; border-radius:9px;
    background:var(--surface-soft); font-weight:700; font-size:13px; color:var(--ink-muted);
    border:1.5px solid var(--line);
  }
  .pay-toggle button.active{background:var(--olive); color:#fff; border-color:var(--olive);}

  /* ---------- طباعة الفاتورة ---------- */
  #print-area{display:none;}
  .receipt-head{text-align:center; margin-bottom:14px;}
  .receipt-head h2{margin:0; font-size:20px;}
  .receipt-head p{margin:4px 0 0 0; font-size:12px; color:#555;}
  .receipt-table{width:100%; border-collapse:collapse; font-size:13px; margin-top:10px;}
  .receipt-table th, .receipt-table td{padding:6px 4px; border-bottom:1px solid #ccc; text-align:start;}
  .receipt-total{display:flex; justify-content:space-between; font-weight:900; font-size:16px; margin-top:10px; border-top:2px solid #000; padding-top:8px;}
  .receipt-footer{text-align:center; font-size:11px; color:#555; margin-top:14px;}
  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{display:block; position:absolute; top:0; right:0; left:0; margin:0 auto; color:#000;}
    #print-area.receipt-thermal{width:76mm; padding:2mm; font-size:11px;}
    #print-area.receipt-thermal .receipt-head h2{font-size:15px;}
    #print-area.receipt-thermal .receipt-table{font-size:10.5px;}
    #print-area.receipt-a4{width:100%; max-width:190mm; padding:15mm; font-size:14px;}
    #print-area.receipt-a4 .receipt-head h2{font-size:26px;}
    #print-area.receipt-a4 .receipt-table{font-size:14px;}
    #print-area.receipt-a4 .receipt-total{font-size:18px;}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">ميزان <small>إدارة المحل</small></div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">بياناتك محفوظة تلقائياً في حسابك</div>
  </aside>
  <div id="main">
    <div id="topbar">
      <h1 id="page-title">الرئيسية</h1>
      <div style="display:flex; align-items:center; gap:18px;">
        <div class="user-switch" id="user-switch"></div>
        <div class="date" id="today-date"></div>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>
<div id="print-area"></div>

<script>
/* ============ إعداد عام ============ */
const VIEWS = [
  {id:'dashboard', label:'الرئيسية', ico:'⌂', roles:['admin','cashier']},
  {id:'pos', label:'نقطة البيع', ico:'🛒', roles:['admin','cashier']},
  {id:'products', label:'المنتجات والمخزون', ico:'📦', roles:['admin','cashier']},
  {id:'purchases', label:'المشتريات', ico:'🚚', roles:['admin']},
  {id:'stockmoves', label:'حركة المخزون', ico:'🔄', roles:['admin']},
  {id:'inventoryCount', label:'الجرد', ico:'📋', roles:['admin']},
  {id:'invoices', label:'الفواتير', ico:'🧾', roles:['admin','cashier']},
  {id:'debts', label:'الديون', ico:'💳', roles:['admin','cashier']},
  {id:'expenses', label:'المصاريف', ico:'💸', roles:['admin']},
  {id:'returns', label:'المرتجعات', ico:'↩️', roles:['admin']},
  {id:'profits', label:'الأرباح', ico:'💰', roles:['admin']},
  {id:'reports', label:'التقارير', ico:'📊', roles:['admin']},
  {id:'contacts', label:'الموردون والعملاء', ico:'👥', roles:['admin','cashier']},
  {id:'employees', label:'الموظفون والصلاحيات', ico:'🔑', roles:['admin']},
  {id:'activityLog', label:'سجل النشاط', ico:'📜', roles:['admin']},
];
const LOW_STOCK = 5;
const UNITS = ['قطعة','كغ','غ','لتر','مل','صندوق','كرتونة','وحدة'];
const WEIGHT_UNITS = ['كغ','غ','لتر','مل'];
const EXPENSE_CATEGORIES = ['كهرباء','ماء','إيجار','نقل','أجور','صيانة','مشتريات أخرى','مصاريف متنوعة'];
const PAYMENT_METHODS = ['نقدي','تحويل بنكي','شيك','أخرى'];
const STOCK_MOVE_TYPES = {
  in: 'إضافة مخزون',
  sale: 'بيع',
  purchase: 'شراء',
  manual: 'تعديل يدوي',
  count: 'جرد',
  returned: 'إرجاع',
};

let state = {
  products: [],
  sales: [],
  suppliers: [],
  customers: [],
  employees: [],
  debtPayments: [],
  stockMoves: [],
  purchases: [],
  supplierPayments: [],
  expenses: [],
  returns: [],
  inventoryCounts: [],
  activityLog: [],
  currentEmployeeId: null,
  cart: [],
  posPayType: 'cash',
  posDiscType: 'fixed',
  posDiscValue: 0,
  posPaidAmount: '',
  view: 'dashboard',
  contactsTab: 'customers',
  debtsTab: 'customers',
  productSearch: '',
  returnSearch: '',
  shopSettings: { name: 'ميزان', info: '', invoiceStart: 1 },
};

function currentEmployee(){
  return state.employees.find(e=>e.id===state.currentEmployeeId) || null;
}
function currentRole(){
  if(!state.employees.length) return 'admin';
  const e = currentEmployee();
  return e ? e.role : 'admin';
}
function currentActorName(){
  const e = currentEmployee();
  return e ? e.name : 'غير محدد';
}
function canAccess(viewId){
  const v = VIEWS.find(x=>x.id===viewId);
  return v.roles.includes(currentRole());
}
function productMinStock(p){
  return (p.minStock===undefined || p.minStock===null || p.minStock==='') ? LOW_STOCK : Number(p.minStock);
}

/** إجمالي المشتريات والمدفوع والمتبقي لمورد معيّن، محسوبة من فواتير الشراء ودفعات الديون دون تكرار البيانات */
function supplierStats(supplierId){
  const purchases = state.purchases.filter(p=>p.supplierId===supplierId);
  const totalPurchases = purchases.reduce((a,p)=>a+p.total,0);
  const paidAtPurchase = purchases.reduce((a,p)=>a+p.paidAmount,0);
  const extraPayments = state.supplierPayments.filter(pm=>pm.supplierId===supplierId).reduce((a,pm)=>a+pm.amount,0);
  const totalPaid = paidAtPurchase + extraPayments;
  const remaining = Math.max(0, Math.round((totalPurchases-totalPaid)*100)/100);
  return {totalPurchases, totalPaid, remaining};
}
function totalSupplierDebt(){
  return state.suppliers.reduce((a,s)=>a+supplierStats(s.id).remaining, 0);
}

/** يسجّل حركة مخزون ولا يجوز حذفها أو تعديلها لاحقًا — كل تغيير في المخزون يُسجَّل هنا */
function logStockMove(product, type, qtyChange, prevStock, newStock){
  state.stockMoves.push({
    id: uid(),
    date: new Date().toISOString(),
    productId: product.id,
    productName: product.name,
    type,
    qtyChange,
    prevStock,
    newStock,
    user: currentActorName(),
  });
  save('stockMoves');
}

/** يسجّل عملية في سجل النشاط العام (تسجيل دخول، بيع، شراء، تسديد دين، جرد، مرتجع، تغيير إعدادات...) */
function logActivity(type, details){
  state.activityLog.push({
    id: uid(),
    date: new Date().toISOString(),
    user: currentActorName(),
    type,
    details,
  });
  save('activityLog');
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const money = (n) => (Math.round(n*100)/100).toLocaleString('ar-DZ', {minimumFractionDigits:2, maximumFractionDigits:2});
const todayStr = () => new Date().toISOString().slice(0,10);

function printInvoice(sale, format){
  format = format || 'thermal';
  const area = document.getElementById('print-area');
  const hasDiscount = (sale.discountAmount||0) > 0;
  const shop = state.shopSettings || {name:'ميزان', info:''};

  area.className = format==='a4' ? 'receipt-a4' : 'receipt-thermal';
  area.innerHTML = `
    <div class="receipt-head">
      <h2>${shop.name || 'ميزان'}</h2>
      ${shop.info ? `<p>${shop.info}</p>` : ''}
      <p>فاتورة بيع رقم ${formatInvoiceNo(sale.invoiceNo||0)}</p>
      <p>${new Date(sale.date).toLocaleString('ar-DZ',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}</p>
      <p>الزبون: ${sale.customerName || 'زبون عابر'} ${sale.paymentType==='credit' ? '— بيع بالدين' : ''}</p>
      ${sale.cashier? `<p>الكاشير: ${sale.cashier}</p>` : ''}
    </div>
    <table class="receipt-table"><thead><tr><th>المنتج</th><th>الكمية</th><th>السعر</th><th>المجموع</th></tr></thead>
    <tbody>${sale.items.map(i=>`<tr><td>${i.name}</td><td>${i.qty}${i.unit?' '+i.unit:''}</td><td>${money(i.price)}</td><td>${money(i.lineTotal!==undefined? i.lineTotal : i.price*i.qty)}</td></tr>`).join('')}</tbody></table>
    ${hasDiscount ? `
    <div class="receipt-total" style="font-size:0.9em; border-top:none; font-weight:400;"><span>المجموع الفرعي</span><span>${money(sale.subtotal)} د.ج</span></div>
    <div class="receipt-total" style="font-size:0.9em; border-top:none; font-weight:400;"><span>الخصم</span><span>-${money(sale.discountAmount)} د.ج</span></div>` : ''}
    <div class="receipt-total"><span>الإجمالي</span><span>${money(sale.total)} د.ج</span></div>
    ${sale.paidAmount!==undefined ? `
    <div class="receipt-total" style="font-size:0.9em; border-top:none; font-weight:400;"><span>المدفوع</span><span>${money(sale.paidAmount)} د.ج</span></div>
    ${sale.paymentType==='credit' && sale.total-sale.paidAmount>0.001 ? `<div class="receipt-total" style="font-size:0.9em; border-top:none; font-weight:400;"><span>المتبقي (دين)</span><span>${money(sale.total-sale.paidAmount)} د.ج</span></div>` : ''}
    ${sale.change>0 ? `<div class="receipt-total" style="font-size:0.9em; border-top:none; font-weight:400;"><span>الباقي للزبون</span><span>${money(sale.change)} د.ج</span></div>` : ''}` : ''}
    <p class="receipt-footer">شكراً لتعاملكم معنا</p>
  `;

  let pageStyle = document.getElementById('dynamic-page-style');
  if(!pageStyle){
    pageStyle = document.createElement('style');
    pageStyle.id = 'dynamic-page-style';
    document.head.appendChild(pageStyle);
  }
  pageStyle.textContent = format==='a4'
    ? '@page{ size:A4; margin:15mm; }'
    : '@page{ size:80mm auto; margin:2mm; }';

  setTimeout(()=>window.print(), 150);
}

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}

/* ============ التخزين ============ */
async function loadAll(){
  const keys = ['products','sales','suppliers','customers','employees','debtPayments','stockMoves','purchases','supplierPayments','expenses','returns','inventoryCounts','activityLog'];
  for(const k of keys){
    try{
      const r = await window.storage.get('gm:'+k, false);
      state[k] = r ? JSON.parse(r.value) : [];
    }catch(e){ state[k] = []; }
  }
  try{
    const r = await window.storage.get('gm:currentEmployeeId', false);
    state.currentEmployeeId = r ? JSON.parse(r.value) : null;
  }catch(e){ state.currentEmployeeId = null; }
  try{
    const r = await window.storage.get('gm:shopSettings', false);
    state.shopSettings = r ? JSON.parse(r.value) : { name:'ميزان', info:'', invoiceStart:1 };
  }catch(e){ state.shopSettings = { name:'ميزان', info:'', invoiceStart:1 }; }
}
async function save(key){
  try{ await window.storage.set('gm:'+key, JSON.stringify(state[key]), false); }
  catch(e){ console.error('storage error', e); toast('تعذر حفظ البيانات'); }
}
async function saveCurrentEmployee(){
  try{ await window.storage.set('gm:currentEmployeeId', JSON.stringify(state.currentEmployeeId), false); }
  catch(e){ console.error(e); }
}
async function saveShopSettings(){
  try{ await window.storage.set('gm:shopSettings', JSON.stringify(state.shopSettings), false); }
  catch(e){ console.error(e); toast('تعذر حفظ إعدادات المحل'); }
}
function nextInvoiceNumber(){
  const maxNo = state.sales.reduce((m,s)=> s.invoiceNo? Math.max(m,s.invoiceNo) : m, 0);
  return maxNo>0 ? maxNo+1 : (parseInt(state.shopSettings.invoiceStart)||1);
}
function formatInvoiceNo(n){
  return String(n).padStart(6,'0');
}

/* ============ التصيير العام ============ */
function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  VIEWS.filter(v=>v.roles.includes(currentRole())).forEach(v=>{
    const b = document.createElement('button');
    b.className = 'nav-btn' + (state.view===v.id ? ' active' : '');
    const label = (v.id==='contacts' && currentRole()==='cashier') ? 'العملاء' : v.label;
    b.innerHTML = `<span class="nav-ico">${v.ico}</span><span>${label}</span>`;
    b.onclick = () => { state.view = v.id; render(); };
    nav.appendChild(b);
  });

  const us = document.getElementById('user-switch');
  if(state.employees.length){
    us.innerHTML = `<span class="role-tag">${currentRole()==='admin'?'مدير':'كاشير'}</span>
      <select id="emp-select">
        ${state.employees.map(e=>`<option value="${e.id}" ${e.id===state.currentEmployeeId?'selected':''}>${e.name}</option>`).join('')}
      </select>`;
    us.querySelector('#emp-select').onchange = (e)=>{
      const targetId = e.target.value;
      const target = state.employees.find(x=>x.id===targetId);
      if(!target){ return; }
      if(!target.pin){
        state.currentEmployeeId = target.id;
        saveCurrentEmployee();
        logActivity('تسجيل الدخول', `دخول ${target.name}`);
        if(!canAccess(state.view)) state.view = 'dashboard';
        render();
        return;
      }
      requestPin(target, ()=>{
        state.currentEmployeeId = target.id;
        saveCurrentEmployee();
        logActivity('تسجيل الدخول', `دخول ${target.name}`);
        if(!canAccess(state.view)) state.view = 'dashboard';
        render();
      }, ()=>{ render(); });
    };
  } else {
    us.innerHTML = '';
  }
}

/** يطلب رمز PIN الخاص بموظف قبل تفعيل التبديل إليه؛ ينفّذ onSuccess عند التطابق أو onCancel عند الإلغاء/الفشل بعد المحاولات */
function requestPin(emp, onSuccess, onCancel){
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `
    <div class="modal">
      <h3>رمز الدخول — ${emp.name}</h3>
      <div class="field"><label>أدخل رمز PIN</label><input id="pin-input" type="password" inputmode="numeric" maxlength="6" placeholder="****"></div>
      <div class="modal-actions">
        <button class="btn" id="pin-confirm" style="width:100%; justify-content:center;">دخول</button>
        <button class="btn ghost" id="pin-cancel">إلغاء</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  const input = ov.querySelector('#pin-input');
  function submit(){
    if(input.value===emp.pin){ ov.remove(); onSuccess(); }
    else { toast('رمز PIN غير صحيح'); input.value=''; input.focus(); }
  }
  input.onkeydown = (e)=>{ if(e.key==='Enter') submit(); };
  ov.querySelector('#pin-confirm').onclick = submit;
  ov.querySelector('#pin-cancel').onclick = ()=>{ ov.remove(); onCancel(); };
  input.focus();
}

function setTitle(){
  const v = VIEWS.find(v=>v.id===state.view);
  document.getElementById('page-title').textContent = (v.id==='contacts' && currentRole()==='cashier') ? 'العملاء' : v.label;
  document.getElementById('today-date').textContent = new Date().toLocaleDateString('ar-DZ', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
}

function render(){
  if(!canAccess(state.view)) state.view = 'dashboard';
  renderNav();
  setTitle();
  const c = document.getElementById('content');
  c.innerHTML = '';
  if(state.view==='dashboard') renderDashboard(c);
  if(state.view==='pos') renderPOS(c);
  if(state.view==='products') renderProducts(c);
  if(state.view==='purchases') renderPurchases(c);
  if(state.view==='stockmoves') renderStockMoves(c);
  if(state.view==='inventoryCount') renderInventoryCount(c);
  if(state.view==='invoices') renderInvoices(c);
  if(state.view==='debts') renderDebts(c);
  if(state.view==='expenses') renderExpenses(c);
  if(state.view==='returns') renderReturns(c);
  if(state.view==='profits') renderProfits(c);
  if(state.view==='reports') renderReports(c);
  if(state.view==='contacts') renderContacts(c);
  if(state.view==='employees') renderEmployees(c);
  if(state.view==='activityLog') renderActivityLog(c);
}

/* ============ المنتجات ============ */
function renderProducts(c){
  const isCashier = currentRole()==='cashier';
  const panel = document.createElement('div');
  panel.className = 'panel';
  const term = (state.productSearch||'').trim().toLowerCase();
  const filtered = !term ? state.products : state.products.filter(p=>
    p.name.toLowerCase().includes(term) || (p.barcode && p.barcode.toLowerCase().includes(term))
  );
  panel.innerHTML = `
    <div class="panel-head">
      <h2>قائمة المنتجات (${filtered.length}${term? ' من '+state.products.length : ''})</h2>
      ${isCashier ? '' : `<button class="btn" id="add-product-btn">+ إضافة منتج</button>`}
    </div>
    <div class="field" style="max-width:320px;">
      <input id="prod-search" placeholder="ابحث بالاسم أو الباركود..." value="${state.productSearch||''}">
    </div>
    ${filtered.length ? `<table><thead><tr>
      <th>المنتج</th><th>الباركود</th><th>الفئة</th>${isCashier?'':'<th>سعر الشراء</th>'}<th>سعر البيع</th>${isCashier?'':'<th>هامش الربح</th>'}<th>المخزون</th><th>الحد الأدنى</th><th>الحالة</th>${isCashier?'':'<th></th>'}
    </tr></thead><tbody id="prod-tbody"></tbody></table>` : `<div class="empty">${state.products.length? 'لا توجد نتائج مطابقة للبحث' : 'لا توجد منتجات — ابدأ بإضافة أول منتج'}</div>`}
  `;
  c.appendChild(panel);
  if(!isCashier) document.getElementById('add-product-btn').onclick = ()=>openProductModal();
  const searchInput = document.getElementById('prod-search');
  searchInput.oninput = (e)=>{ state.productSearch = e.target.value; render(); };
  searchInput.focus();
  searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length);

  const tbody = document.getElementById('prod-tbody');
  if(tbody){
    filtered.forEach(p=>{
      const tr = document.createElement('tr');
      const margin = p.price>0 ? ((p.price-p.cost)/p.price*100) : 0;
      const minS = productMinStock(p);
      tr.innerHTML = `
        <td><strong>${p.name}</strong></td>
        <td>${p.barcode||'—'}</td>
        <td>${p.category||'—'}</td>
        ${isCashier?'':`<td>${money(p.cost)} د.ج</td>`}
        <td>${money(p.price)} د.ج</td>
        ${isCashier?'':`<td>${margin.toFixed(1)}٪</td>`}
        <td>${p.stock} ${p.unit}</td>
        <td>${minS} ${p.unit}</td>
        <td>${p.stock<=minS ? '<span class="badge low">منخفض</span>' : '<span class="badge ok">متوفر</span>'}</td>
        ${isCashier?'':`<td style="white-space:nowrap;">
          <button class="btn ghost small edit-p">تعديل</button>
          <button class="btn danger small del-p">حذف</button>
        </td>`}`;
      if(!isCashier){
        tr.querySelector('.edit-p').onclick = ()=>openProductModal(p);
        tr.querySelector('.del-p').onclick = ()=>{
          if(confirm(`حذف "${p.name}" من المنتجات؟`)){
            state.products = state.products.filter(x=>x.id!==p.id);
            save('products'); render();
          }
        };
      }
      tbody.appendChild(tr);
    });
  }
}

function openProductModal(p){
  const isEdit = !!p;
  const prevStock = p ? p.stock : 0;
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `
    <div class="modal">
      <h3>${isEdit? 'تعديل منتج' : 'إضافة منتج جديد'}</h3>
      <div class="field"><label>اسم المنتج</label><input id="f-name" value="${p?.name||''}"></div>
      <div class="field"><label>الفئة</label><input id="f-cat" value="${p?.category||''}" placeholder="مثال: ألبان، مشروبات..."></div>
      <div class="field"><label>الباركود (اختياري)</label><input id="f-barcode" value="${p?.barcode||''}" placeholder="امسح أو اكتب رقم الباركود"></div>
      <div class="grid grid-2">
        <div class="field"><label>سعر الشراء (د.ج)</label><input id="f-cost" type="number" step="0.01" value="${p?.cost??''}"></div>
        <div class="field"><label>سعر البيع (د.ج)</label><input id="f-price" type="number" step="0.01" value="${p?.price??''}"></div>
      </div>
      <div class="grid grid-2">
        <div class="field"><label>الكمية الحالية</label><input id="f-stock" type="number" value="${p?.stock??''}"></div>
        <div class="field"><label>الوحدة</label>
          <select id="f-unit">${UNITS.map(u=>`<option value="${u}" ${p?.unit===u?'selected':''}>${u}</option>`).join('')}</select>
        </div>
      </div>
      <div class="field"><label>الحد الأدنى للمخزون (للتنبيه)</label><input id="f-minstock" type="number" value="${p? productMinStock(p) : LOW_STOCK}"></div>
      <div class="modal-actions">
        <button class="btn" id="save-p">${isEdit?'حفظ التعديلات':'إضافة'}</button>
        <button class="btn ghost" id="cancel-p">إلغاء</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  ov.querySelector('#cancel-p').onclick = ()=>ov.remove();
  ov.querySelector('#save-p').onclick = ()=>{
    const name = document.getElementById('f-name').value.trim();
    if(!name){ toast('الرجاء إدخال اسم المنتج'); return; }
    const price = parseFloat(document.getElementById('f-price').value)||0;
    const cost = parseFloat(document.getElementById('f-cost').value)||0;
    const newStock = parseInt(document.getElementById('f-stock').value)||0;
    if(price<0 || cost<0 || newStock<0){ toast('لا يمكن إدخال قيم سالبة'); return; }
    const data = {
      name,
      category: document.getElementById('f-cat').value.trim(),
      barcode: document.getElementById('f-barcode').value.trim(),
      price, cost,
      stock: newStock,
      unit: document.getElementById('f-unit').value,
      minStock: parseInt(document.getElementById('f-minstock').value)||0,
    };
    if(isEdit){
      Object.assign(p, data);
      if(newStock!==prevStock){
        logStockMove(p, STOCK_MOVE_TYPES.manual, newStock-prevStock, prevStock, newStock);
      }
    }else{
      const newProduct = {id:uid(), ...data};
      state.products.push(newProduct);
      if(newStock>0){
        logStockMove(newProduct, STOCK_MOVE_TYPES.in, newStock, 0, newStock);
      }
    }
    save('products'); ov.remove(); render();
    toast(isEdit? 'تم حفظ التعديلات' : 'تمت إضافة المنتج');
  };
}

  if(!state.products.length){ toast('أضف منتجات أولاً من صفحة المنتجات'); return; }

  let items = []; // {productId, name, unit, qty, cost}

  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `
    <div class="modal wide">
      <h3>فاتورة شراء جديدة</h3>
      <div class="grid grid-2">
        <div class="field"><label>المورد</label>
          <select id="pu-supplier">${state.suppliers.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select>
        </div>
        <div class="field"><label>تاريخ الشراء</label><input id="pu-date" type="date" value="${todayStr()}"></div>
      </div>
      <div class="field"><label>رقم فاتورة المورد (اختياري)</label><input id="pu-invnum" placeholder="مثال: INV-2026-001"></div>

      <label>إضافة منتج إلى الفاتورة</label>
      <div class="add-item-row">
        <select id="pu-product">${state.products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select>
        <input id="pu-qty" type="number" min="1" value="1" placeholder="الكمية">
        <input id="pu-cost" type="number" step="0.01" placeholder="سعر الشراء">
        <button class="btn small" id="pu-add-item" type="button">إضافة</button>
      </div>

      <table class="mini-table"><thead><tr><th>المنتج</th><th>الكمية</th><th>السعر</th><th>المجموع</th><th></th></tr></thead>
      <tbody id="pu-items-body"></tbody></table>
      <div class="empty" id="pu-empty" style="padding:14px 0;">لم تتم إضافة منتجات بعد</div>

      <div class="summary-row"><span>المجموع الفرعي</span><span id="pu-subtotal">0.00 د.ج</span></div>
      <div class="field" style="margin-top:8px;"><label>الخصم (د.ج)</label><input id="pu-discount" type="number" step="0.01" value="0"></div>
      <div class="summary-row total"><span>الإجمالي</span><span id="pu-total">0.00 د.ج</span></div>
      <div class="field"><label>المبلغ المدفوع (د.ج)</label><input id="pu-paid" type="number" step="0.01" value="0"></div>
      <div class="summary-row remaining"><span>المتبقي</span><span id="pu-remaining">0.00 د.ج</span></div>
      <div class="field"><label>ملاحظات</label><textarea id="pu-notes" rows="2"></textarea></div>

      <div class="modal-actions">
        <button class="btn" id="pu-save">حفظ فاتورة الشراء</button>
        <button class="btn ghost" id="pu-cancel">إلغاء</button>
      </div>
    </div>`;
  document.body.appendChild(ov);

  const productSelect = ov.querySelector('#pu-product');
  const costInput = ov.querySelector('#pu-cost');
  function fillCostFromProduct(){
    const prod = state.products.find(x=>x.id===productSelect.value);
    if(prod) costInput.value = prod.cost;
  }
  productSelect.onchange = fillCostFromProduct;
  fillCostFromProduct();

  function recalc(){
    const subtotal = items.reduce((a,i)=>a+i.qty*i.cost,0);
    const discount = Math.min(parseFloat(ov.querySelector('#pu-discount').value)||0, subtotal);
    const total = Math.max(0, subtotal - discount);
    const paid = Math.max(0, parseFloat(ov.querySelector('#pu-paid').value)||0);
    const remaining = Math.max(0, total - paid);
    ov.querySelector('#pu-subtotal').textContent = money(subtotal)+' د.ج';
    ov.querySelector('#pu-total').textContent = money(total)+' د.ج';
    ov.querySelector('#pu-remaining').textContent = money(remaining)+' د.ج';
    return {subtotal, discount, total, paid, remaining};
  }

  function renderItemsTable(){
    const body = ov.querySelector('#pu-items-body');
    const emptyMsg = ov.querySelector('#pu-empty');
    body.innerHTML = '';
    emptyMsg.style.display = items.length ? 'none' : 'block';
    items.forEach((it,idx)=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${it.name}</td><td>${it.qty} ${it.unit}</td><td>${money(it.cost)}</td><td>${money(it.qty*it.cost)}</td>
        <td><button class="btn danger small pu-remove" type="button">حذف</button></td>`;
      tr.querySelector('.pu-remove').onclick = ()=>{ items.splice(idx,1); renderItemsTable(); recalc(); };
      body.appendChild(tr);
    });
    recalc();
  }

  ov.querySelector('#pu-add-item').onclick = ()=>{
    const prod = state.products.find(x=>x.id===productSelect.value);
    if(!prod){ toast('اختر منتجاً'); return; }
    const qty = parseInt(ov.querySelector('#pu-qty').value)||0;
    const cost = parseFloat(costInput.value)||0;
    if(qty<=0){ toast('أدخل كمية صحيحة'); return; }
    if(cost<0){ toast('لا يمكن أن يكون سعر الشراء سالباً'); return; }
    const existing = items.find(i=>i.productId===prod.id);
    if(existing){ existing.qty += qty; existing.cost = cost; }
    else items.push({productId:prod.id, name:prod.name, unit:prod.unit, qty, cost});
    renderItemsTable();
  };

  ov.querySelector('#pu-discount').oninput = recalc;
  ov.querySelector('#pu-paid').oninput = recalc;
  ov.querySelector('#pu-cancel').onclick = ()=>ov.remove();

  ov.querySelector('#pu-save').onclick = ()=>{
    if(!items.length){ toast('أضف منتجاً واحداً على الأقل'); return; }
    const supplierId = ov.querySelector('#pu-supplier').value;
    const supplier = state.suppliers.find(s=>s.id===supplierId);
    const {subtotal, discount, total, paid} = recalc();
    if(paid>total){ toast('المبلغ المدفوع لا يمكن أن يتجاوز الإجمالي'); return; }
    const date = ov.querySelector('#pu-date').value || todayStr();

    const purchase = {
      id: uid(),
      date: new Date(date+'T'+new Date().toTimeString().slice(0,8)).toISOString(),
      supplierId, supplierName: supplier? supplier.name : '—',
      invoiceNumber: ov.querySelector('#pu-invnum').value.trim(),
      items: items.map(i=>({...i})),
      subtotal: Math.round(subtotal*100)/100,
      discount: Math.round(discount*100)/100,
      total: Math.round(total*100)/100,
      paidAmount: Math.round(paid*100)/100,
      notes: ov.querySelector('#pu-notes').value.trim(),
      createdBy: currentActorName(),
    };
    state.purchases.push(purchase);

    items.forEach(it=>{
      const p = state.products.find(pp=>pp.id===it.productId);
      if(!p) return;
      const prevStock = p.stock;
      const newStock = prevStock + it.qty;
      // تحديث تكلفة المنتج بطريقة المتوسط المرجّح (Weighted Average Cost)
      const newCost = (prevStock + it.qty) > 0
        ? Math.round(((prevStock*p.cost + it.qty*it.cost) / (prevStock + it.qty))*100)/100
        : it.cost;
      p.stock = newStock;
      p.cost = newCost;
      logStockMove(p, STOCK_MOVE_TYPES.purchase, it.qty, prevStock, newStock);
    });

    save('purchases'); save('products');
    ov.remove(); render();
    toast('تم حفظ فاتورة الشراء وتحديث المخزون بنجاح');
  };

  renderItemsTable();
}

    </p>
    ${state.products.length ? `<table><thead><tr>
      <th>المنتج</th><th>الكمية في النظام</th><th>الكمية الفعلية</th><th>الفرق</th>
    </tr></thead><tbody id="count-tbody"></tbody></table>

  `;
  c.appendChild(panel);

  const tbody = document.getElementById('count-tbody');
  if(tbody){
    state.products.forEach(p=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${p.name}</strong></td>
        <td>${p.stock} ${p.unit}</td>
        <td><input class="count-actual" data-pid="${p.id}" type="number" step="0.001" value="${p.stock}" style="width:100px;"></td>
        <td class="count-diff" data-pid="${p.id}">0</td>`;
      tr.querySelector('.count-actual').oninput = (e)=>{
        const actual = parseFloat(e.target.value);
        const diffCell = tr.querySelector('.count-diff');
        if(isNaN(actual)){ diffCell.textContent = '—'; return; }
        const diff = Math.round((actual - p.stock)*1000)/1000;
        diffCell.textContent = (diff>0?'+':'')+diff;
        diffCell.style.color = diff===0 ? 'var(--ink-muted)' : (diff<0 ? 'var(--brick)' : 'var(--olive)');
        diffCell.style.fontWeight = diff===0 ? '400' : '700';
      };
      tbody.appendChild(tr);
    });
  }

  const applyBtn = document.getElementById('apply-count-btn');
  if(applyBtn){
    applyBtn.onclick = ()=>{
      const changes = [];
      state.products.forEach(p=>{
        const input = document.querySelector(`.count-actual[data-pid="${p.id}"]`);
        if(!input) return;
        const actual = parseFloat(input.value);
        if(isNaN(actual) || actual<0) return;
        const diff = Math.round((actual-p.stock)*1000)/1000;
        if(diff!==0) changes.push({product:p, systemQty:p.stock, actualQty: Math.round(actual*1000)/1000, diff});
      });
      if(!changes.length){ toast('لا توجد فروقات لتسجيلها'); return; }
      if(!confirm(`سيتم تعديل مخزون ${changes.length} منتج حسب الجرد الفعلي. هل تريد المتابعة؟`)) return;

      const notes = document.getElementById('count-notes').value.trim();
      const countRecord = {
        id: uid(),
        date: new Date().toISOString(),
        user: currentActorName(),
        notes,
        items: changes.map(ch=>({
          productId: ch.product.id, name: ch.product.name, unit: ch.product.unit,
          systemQty: ch.systemQty, actualQty: ch.actualQty, diff: ch.diff,
        })),
      };
      state.inventoryCounts.push(countRecord);

      changes.forEach(ch=>{
        const p = ch.product;
        const prevStock = p.stock;
        p.stock = ch.actualQty;
        logStockMove(p, STOCK_MOVE_TYPES.count, ch.diff, prevStock, ch.actualQty);
      });

      save('products'); save('inventoryCounts');
      toast(`تم اعتماد الجرد وتعديل مخزون ${changes.length} منتج`);
      render();
    };
  }

  const histPanel = document.createElement('div');
  histPanel.className = 'panel';
  histPanel.style.marginTop = '18px';
  const sorted = [...state.inventoryCounts].sort((a,b)=>b.date.localeCompare(a.date));
  histPanel.innerHTML = `<h2>سجل عمليات الجرد (${state.inventoryCounts.length})</h2>` + (sorted.length ? `
    <table><thead><tr><th>التاريخ والوقت</th><th>المستخدم</th><th>عدد المنتجات المعدَّلة</th><th></th></tr></thead>
    <tbody id="count-hist-tbody"></tbody></table>` : `<div class="empty">لا توجد عمليات جرد سابقة</div>`);
  c.appendChild(histPanel);

  const htbody = document.getElementById('count-hist-tbody');
  if(htbody){
    sorted.forEach(cnt=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${new Date(cnt.date).toLocaleString('ar-DZ',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}</td>
        <td>${cnt.user}</td>
        <td>${cnt.items.length}</td>
        <td><button class="btn ghost small view-count">التفاصيل</button></td>`;
      tr.querySelector('.view-count').onclick = ()=>{
        const ov = document.createElement('div');
        ov.className = 'overlay';
        ov.innerHTML = `<div class="modal wide">
          <h3>تفاصيل الجرد — ${new Date(cnt.date).toLocaleString('ar-DZ',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}</h3>
          <p style="color:var(--ink-muted); font-size:13px; margin-top:-8px;">بواسطة: ${cnt.user}</p>
          <table class="mini-table"><thead><tr><th>المنتج</th><th>النظام</th><th>الفعلي</th><th>الفرق</th></tr></thead>
          <tbody>${cnt.items.map(it=>`<tr><td>${it.name}</td><td>${it.systemQty} ${it.unit||''}</td><td>${it.actualQty} ${it.unit||''}</td>
            <td style="color:${it.diff<0?'var(--brick)':'var(--olive)'}; font-weight:700;">${it.diff>0?'+':''}${it.diff}</td></tr>`).join('')}</tbody></table>
          ${cnt.notes? `<p style="margin-top:10px; font-size:13px;"><strong>ملاحظات:</strong> ${cnt.notes}</p>` : ''}
          <div class="modal-actions"><button class="btn ghost" id="close-count">إغلاق</button></div>
        </div>`;
        document.body.appendChild(ov);
        ov.querySelector('#close-count').onclick = ()=>ov.remove();
      };
      htbody.appendChild(tr);
    });
  }
}

/* ============ نقطة البيع ============ */
function lineNet(item){
  const gross = item.price*item.qty;
  const disc = item.discType==='percent' ? gross*(item.discVal||0)/100 : (item.discVal||0);
  return Math.max(0, gross - Math.min(disc, gross));
}
function cartSubtotal(){
  return state.cart.reduce((a,i)=>a+lineNet(i),0);
}
function invoiceDiscountAmount(subtotal){
  const v = Number(state.posDiscValue)||0;
  const amt = state.posDiscType==='percent' ? subtotal*v/100 : v;
  return Math.min(Math.max(0,amt), subtotal);
}
function cartGrandTotal(){
  const subtotal = cartSubtotal();
  return Math.max(0, subtotal - invoiceDiscountAmount(subtotal));
}

function renderPOS(c){
  const wrap = document.createElement('div');
  wrap.className = 'pos-wrap';

  const left = document.createElement('div');
  left.innerHTML = `
    <div class="barcode-row"><input id="pos-barcode" placeholder="امسح أو اكتب الباركود ثم Enter"></div>
    <div class="pos-search"><input id="pos-search" placeholder="ابحث عن منتج بالاسم..."></div>
    <div class="product-grid" id="pos-grid"></div>`;

  const right = document.createElement('div');
  right.innerHTML = `
    <div class="cart-box">
      <h2 style="margin:0 0 12px 0; font-size:15px;">سلة البيع</h2>
      <div class="field">
        <label>الزبون ${state.posPayType==='credit'?'(إلزامي للبيع بالدين)':'(اختياري)'}</label>
        <select id="pos-customer"><option value="">زبون عابر</option>
          ${state.customers.map(cu=>`<option value="${cu.id}">${cu.name}${cu.balance>0?` — دين حالي ${money(cu.balance)}`:''}</option>`).join('')}
        </select>
      </div>
      <div class="pay-toggle">
        <button id="pay-cash" class="${state.posPayType==='cash'?'active':''}">دفع نقدي</button>
        <button id="pay-credit" class="${state.posPayType==='credit'?'active':''}">بيع بالدين</button>
      </div>

      <div id="cart-items"></div>

      <div class="summary-row"><span>المجموع الفرعي</span><span id="pos-subtotal">0.00 د.ج</span></div>
      <div class="invoice-disc-row">
        <label style="margin:0; font-size:12px; white-space:nowrap;">خصم الفاتورة</label>
        <input id="pos-inv-disc-val" type="number" step="0.01" min="0" value="${state.posDiscValue}">
        <select id="pos-inv-disc-type">
          <option value="fixed" ${state.posDiscType==='fixed'?'selected':''}>د.ج</option>
          <option value="percent" ${state.posDiscType==='percent'?'selected':''}>٪</option>
        </select>
      </div>
      <div class="cart-total"><span>الإجمالي</span><span id="cart-total-val">0.00 د.ج</span></div>

      <div class="field"><label>المبلغ المدفوع (د.ج)</label><input id="pos-paid" type="number" step="0.01" min="0" value="${state.posPaidAmount}" placeholder="اتركه فارغاً لدفع كامل المبلغ"></div>
      <div id="pos-change-row"></div>

      <button class="btn saffron" id="checkout-btn" style="width:100%; justify-content:center; margin-top:10px;">إتمام البيع</button>
      <div class="muted-note">سيتم خصم الكميات من المخزون تلقائياً</div>
    </div>`;

  wrap.appendChild(left);
  wrap.appendChild(right);
  c.appendChild(wrap);

  function isWeightUnit(unit){ return WEIGHT_UNITS.includes(unit); }

  function addToCart(p, qty){
    if(p.stock<=0){ toast('نفدت الكمية من هذا المنتج'); return; }
    const item = state.cart.find(i=>i.id===p.id);
    if(item){
      const newQty = Math.round((item.qty+qty)*1000)/1000;
      if(newQty<=item.maxStock) item.qty = newQty; else toast('لا يوجد مخزون كافٍ');
    } else {
      state.cart.push({id:p.id, name:p.name, price:p.price, unit:p.unit, qty, maxStock:p.stock, discType:'fixed', discVal:0});
    }
    renderCart();
  }

  function renderGrid(filter=''){
    const grid = document.getElementById('pos-grid');
    grid.innerHTML = '';
    const list = state.products.filter(p=>p.name.includes(filter));
    if(!list.length){ grid.innerHTML = `<div class="empty">لا توجد نتائج</div>`; return; }
    list.forEach(p=>{
      const tile = document.createElement('div');
      tile.className = 'product-tile';
      tile.innerHTML = `<div class="pname">${p.name}</div><div class="pprice">${money(p.price)} د.ج</div><div class="pstock">متبقي: ${p.stock} ${p.unit}</div>`;
      tile.onclick = ()=> addToCart(p, isWeightUnit(p.unit) ? 1 : 1);
      grid.appendChild(tile);
    });
  }
  document.getElementById('pos-search').oninput = (e)=>renderGrid(e.target.value);

  document.getElementById('pay-cash').onclick = ()=>{ state.posPayType='cash'; renderPOS(document.getElementById('content')); };
  document.getElementById('pay-credit').onclick = ()=>{ state.posPayType='credit'; renderPOS(document.getElementById('content')); };

  const barcodeInput = document.getElementById('pos-barcode');
  barcodeInput.onkeydown = (e)=>{
    if(e.key!=='Enter') return;
    const code = barcodeInput.value.trim();
    if(!code) return;
    const p = state.products.find(pp=>pp.barcode && pp.barcode===code);
    if(!p){ toast('لا يوجد منتج بهذا الباركود'); barcodeInput.value=''; return; }
    addToCart(p, 1);
    barcodeInput.value='';
  };

  document.getElementById('pos-inv-disc-val').oninput = (e)=>{ state.posDiscValue = e.target.value; recalcSummary(); };
  document.getElementById('pos-inv-disc-type').onchange = (e)=>{ state.posDiscType = e.target.value; recalcSummary(); };
  document.getElementById('pos-paid').oninput = (e)=>{ state.posPaidAmount = e.target.value; recalcSummary(); };

  function recalcSummary(){
    const subtotal = cartSubtotal();
    const total = cartGrandTotal();
    document.getElementById('pos-subtotal').textContent = money(subtotal)+' د.ج';
    document.getElementById('cart-total-val').textContent = money(total)+' د.ج';
    const paid = state.posPaidAmount==='' ? null : Math.max(0, Number(state.posPaidAmount)||0);
    const changeRow = document.getElementById('pos-change-row');
    if(paid===null){
      changeRow.innerHTML = `<div class="muted-note">سيُعتبر المبلغ المدفوع كامل الإجمالي (${money(total)} د.ج) ما لم تُدخل مبلغاً آخر</div>`;
    } else if(paid>=total){
      changeRow.innerHTML = `<div class="change-row pay"><span>الباقي للزبون</span><span>${money(paid-total)} د.ج</span></div>`;
    } else if(state.posPayType==='credit'){
      changeRow.innerHTML = `<div class="change-row owe"><span>سيُضاف إلى دين الزبون</span><span>${money(total-paid)} د.ج</span></div>`;
    } else {
      changeRow.innerHTML = `<div class="change-row owe"><span>المبلغ غير كافٍ لدفع نقدي</span><span>${money(total-paid)} د.ج</span></div>`;
    }
    return {subtotal, total, paid: paid===null? total : paid};
  }

  function renderCart(){
    const box = document.getElementById('cart-items');
    box.innerHTML = '';
    if(!state.cart.length){ box.innerHTML = `<div class="empty" style="padding:20px 0;">السلة فارغة</div>`; }
    state.cart.forEach(item=>{
      const row = document.createElement('div');
      row.className = 'cart-line';
      const weight = isWeightUnit(item.unit);
      row.innerHTML = `
        <div class="cart-line-top">
          <span class="ci-name">${item.name}</span>
          <button class="cart-remove" title="حذف من السلة">✕</button>
        </div>
        <div class="cart-line-mid">
          ${weight
            ? `<input class="qty-decimal" type="number" step="0.001" min="0.001" value="${item.qty}">`
            : `<div class="qty-ctrl"><button class="dec">−</button><span>${item.qty}</span><button class="inc">+</button></div>`}
          <span class="line-net">${money(lineNet(item))} د.ج</span>
        </div>
        <div class="cart-line-disc">
          <label>خصم الصنف</label>
          <input class="line-disc-val" type="number" step="0.01" min="0" value="${item.discVal}">
          <select class="line-disc-type">
            <option value="fixed" ${item.discType==='fixed'?'selected':''}>د.ج</option>
            <option value="percent" ${item.discType==='percent'?'selected':''}>٪</option>
          </select>
        </div>`;
      row.querySelector('.cart-remove').onclick = ()=>{
        state.cart = state.cart.filter(i=>i.id!==item.id);
        renderCart();
      };
      if(weight){
        row.querySelector('.qty-decimal').onchange = (e)=>{
          let v = parseFloat(e.target.value)||0;
          if(v<=0){ toast('أدخل كمية أكبر من صفر'); e.target.value=item.qty; return; }
          if(v>item.maxStock){ toast('الكمية تتجاوز المخزون المتوفر'); v=item.maxStock; }
          item.qty = Math.round(v*1000)/1000;
          renderCart();
        };
      } else {
        row.querySelector('.inc').onclick = ()=>{
          if(item.qty<item.maxStock) item.qty++; else toast('لا يوجد مخزون كافٍ');
          renderCart();
        };
        row.querySelector('.dec').onclick = ()=>{
          item.qty--;
          if(item.qty<=0) state.cart = state.cart.filter(i=>i.id!==item.id);
          renderCart();
        };
      }
      row.querySelector('.line-disc-val').oninput = (e)=>{ item.discVal = parseFloat(e.target.value)||0; renderCart(); };
      row.querySelector('.line-disc-type').onchange = (e)=>{ item.discType = e.target.value; renderCart(); };
      box.appendChild(row);
    });
    recalcSummary();
  }

  document.getElementById('checkout-btn').onclick = ()=>{
    if(!state.cart.length){ toast('السلة فارغة'); return; }
    const custId = document.getElementById('pos-customer').value;
    const cust = state.customers.find(cu=>cu.id===custId);
    if(state.posPayType==='credit' && !cust){ toast('اختر زبوناً لتسجيل البيع بالدين'); return; }

    const {subtotal, total, paid} = recalcSummary();
    if(state.posPayType==='cash' && paid<total){ toast('المبلغ المدفوع غير كافٍ لدفع نقدي'); return; }

    const sale = {
      id: uid(),
      invoiceNo: nextInvoiceNumber(),
      date: new Date().toISOString(),
      items: state.cart.map(i=>{
        const prod = state.products.find(pp=>pp.id===i.id);
        return {
          productId:i.id, name:i.name, price:i.price, qty:i.qty, unit:i.unit,
          cost: prod? prod.cost : 0,
          discType:i.discType, discVal:i.discVal, lineTotal: Math.round(lineNet(i)*100)/100,
        };
      }),
      subtotal: Math.round(subtotal*100)/100,
      discountType: state.posDiscType,
      discountValue: Number(state.posDiscValue)||0,
      discountAmount: Math.round(invoiceDiscountAmount(subtotal)*100)/100,
      total: Math.round(total*100)/100,
      paidAmount: Math.round(Math.min(paid,total)*100)/100,
      change: Math.round(Math.max(0,paid-total)*100)/100,
      customerId: custId||null,
      customerName: cust? cust.name : null,
      paymentType: state.posPayType,
      paid: state.posPayType==='cash',
      cashier: currentActorName(),
    };
    state.sales.push(sale);
    const lowAfterSale = [];
    state.cart.forEach(i=>{
      const p = state.products.find(pp=>pp.id===i.id);
      if(p){
        const prevStock = p.stock;
        p.stock = Math.round(Math.max(0, p.stock - i.qty)*1000)/1000;
        logStockMove(p, STOCK_MOVE_TYPES.sale, -(prevStock-p.stock), prevStock, p.stock);
        if(p.stock<=productMinStock(p)) lowAfterSale.push(p.name);
      }
    });
    if(state.posPayType==='credit' && cust){
      const remainingDebt = Math.max(0, total-paid);
      if(remainingDebt>0){
        cust.balance = Math.round(((cust.balance||0) + remainingDebt)*100)/100;
        save('customers');
      }
    }
    state.cart = [];
    state.posPayType = 'cash';
    state.posDiscType = 'fixed';
    state.posDiscValue = 0;
    state.posPaidAmount = '';
    save('sales'); save('products');
    logActivity('بيع', `فاتورة رقم ${sale.invoiceNo?formatInvoiceNo(sale.invoiceNo):'—'} بمبلغ ${money(sale.total)} د.ج (${sale.customerName||'زبون عابر'})`);
    toast('تمت عملية البيع بنجاح ✓');
    if(lowAfterSale.length) toast('تنبيه: مخزون منخفض — ' + lowAfterSale.join('، '));
    render();
    printInvoice(sale);
  };

  renderGrid();
  renderCart();
}

/* ============ المرتجعات ============ */
function returnedQtyForSaleItem(saleId, productId){
  return state.returns
    .filter(r=>r.saleId===saleId)
    .reduce((a,r)=> a + r.items.filter(it=>it.productId===productId).reduce((aa,it)=>aa+it.qty,0), 0);
}

function renderReturns(c){
  const panel = document.createElement('div');
  panel.className = 'panel';
  const term = (state.returnSearch||'').trim().toLowerCase();
  const matches = !term ? [] : [...state.sales].filter(s=>
    (s.customerName||'زبون عابر').toLowerCase().includes(term) || s.date.slice(0,10).includes(term)
  ).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,15);

  panel.innerHTML = `
    <h2>البحث عن فاتورة لإرجاع منتجات منها</h2>
    <div class="field" style="max-width:360px;">
      <input id="ret-search" placeholder="ابحث باسم الزبون أو التاريخ (مثال 2026-09)..." value="${state.returnSearch||''}">
    </div>
    ${term ? (matches.length ? `<table><thead><tr><th>التاريخ</th><th>الزبون</th><th>الإجمالي</th><th></th></tr></thead>
      <tbody id="ret-search-tbody"></tbody></table>` : `<div class="empty">لا توجد فواتير مطابقة</div>`) : `<div class="empty">اكتب اسم الزبون أو التاريخ لعرض الفواتير</div>`}
  `;
  c.appendChild(panel);

  const searchInput = document.getElementById('ret-search');
  searchInput.oninput = (e)=>{ state.returnSearch = e.target.value; render(); };
  searchInput.focus();
  searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length);

  const stbody = document.getElementById('ret-search-tbody');
  if(stbody){
    matches.forEach(s=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${new Date(s.date).toLocaleString('ar-DZ',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}</td>
        <td>${s.customerName||'زبون عابر'}</td><td>${money(s.total)} د.ج</td>
        <td><button class="btn saffron small open-ret">فتح لإرجاع</button></td>`;
      tr.querySelector('.open-ret').onclick = ()=>openReturnModal(s);
      stbody.appendChild(tr);
    });
  }

  const histPanel = document.createElement('div');
  histPanel.className = 'panel';
  histPanel.style.marginTop = '18px';
  const sortedReturns = [...state.returns].sort((a,b)=>b.date.localeCompare(a.date));
  histPanel.innerHTML = `<h2>سجل المرتجعات (${state.returns.length})</h2>` + (sortedReturns.length ? `
    <table><thead><tr><th>التاريخ</th><th>فاتورة البيع الأصلية</th><th>الزبون</th><th>الأصناف</th><th>المبلغ المسترجع</th><th>السبب</th></tr></thead>
    <tbody></tbody></table>` : `<div class="empty">لا توجد مرتجعات مسجلة بعد</div>`);
  c.appendChild(histPanel);
  const rtbody = histPanel.querySelector('tbody');
  if(rtbody){
    sortedReturns.forEach(r=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${new Date(r.date).toLocaleString('ar-DZ',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}</td>
        <td>${new Date(r.saleDate).toLocaleDateString('ar-DZ',{day:'2-digit',month:'2-digit',year:'numeric'})}</td>
        <td>${r.customerName||'زبون عابر'}</td>
        <td>${r.items.map(it=>`${it.name} (${it.qty})`).join('، ')}</td>
        <td><span class="debt-amount">${money(r.totalRefund)} د.ج</span></td>
        <td>${r.reason}</td>`;
      rtbody.appendChild(tr);
    });
  }
}

function openReturnModal(sale){
  const rows = sale.items.map(it=>{
    const already = returnedQtyForSaleItem(sale.id, it.productId);
    const remaining = Math.round((it.qty-already)*1000)/1000;
    return {...it, already, remaining};
  }).filter(r=>r.remaining>0.0001);

  const ov = document.createElement('div');
  ov.className = 'overlay';
  if(!rows.length){
    ov.innerHTML = `<div class="modal"><h3>إرجاع منتجات</h3>
      <div class="empty">كل أصناف هذه الفاتورة تم إرجاعها بالكامل مسبقاً</div>
      <div class="modal-actions"><button class="btn ghost" id="ret-close-empty">إغلاق</button></div></div>`;
    document.body.appendChild(ov);
    ov.querySelector('#ret-close-empty').onclick = ()=>ov.remove();
    return;
  }

  ov.innerHTML = `
    <div class="modal wide">
      <h3>إرجاع منتجات — فاتورة ${new Date(sale.date).toLocaleDateString('ar-DZ')} (${sale.customerName||'زبون عابر'})</h3>
      <table class="mini-table"><thead><tr><th>المنتج</th><th>المُباع</th><th>القابل للإرجاع</th><th>الكمية المرتجعة</th></tr></thead>
      <tbody>
        ${rows.map((r,idx)=>`<tr>
          <td>${r.name}</td>
          <td>${r.qty}${r.unit?' '+r.unit:''}</td>
          <td>${r.remaining}${r.unit?' '+r.unit:''}</td>
          <td><input class="ret-qty" data-idx="${idx}" type="number" step="0.001" min="0" max="${r.remaining}" value="0" style="width:90px;"></td>
        </tr>`).join('')}
      </tbody></table>
      <div class="field"><label>سبب الإرجاع</label><textarea id="ret-reason" rows="2" placeholder="مثال: منتج تالف، خطأ في الطلب..."></textarea></div>
      <div class="summary-row total"><span>إجمالي المبلغ المسترجع</span><span id="ret-refund-total">0.00 د.ج</span></div>
      <div class="modal-actions">
        <button class="btn" id="ret-save">تأكيد الإرجاع</button>
        <button class="btn ghost" id="ret-cancel">إلغاء</button>
      </div>
    </div>`;
  document.body.appendChild(ov);

  const invoiceDiscRatio = sale.subtotal>0 ? sale.total/sale.subtotal : 1;
  function unitRefund(r){
    const lineTotal = r.lineTotal!==undefined ? r.lineTotal : r.price*r.qty;
    return (lineTotal/r.qty) * invoiceDiscRatio;
  }
  function recalcRefund(){
    let total = 0;
    ov.querySelectorAll('.ret-qty').forEach(inp=>{
      const idx = Number(inp.dataset.idx);
      const qty = Math.max(0, parseFloat(inp.value)||0);
      total += qty * unitRefund(rows[idx]);
    });
    ov.querySelector('#ret-refund-total').textContent = money(total)+' د.ج';
  }
  ov.querySelectorAll('.ret-qty').forEach(inp=>{
    inp.oninput = ()=>{
      const max = parseFloat(inp.max)||0;
      let v = parseFloat(inp.value)||0;
      if(v>max){ v=max; inp.value=max; }
      if(v<0){ v=0; inp.value=0; }
      recalcRefund();
    };
  });

  ov.querySelector('#ret-cancel').onclick = ()=>ov.remove();
  ov.querySelector('#ret-save').onclick = ()=>{
    const reason = document.getElementById('ret-reason').value.trim();
    if(!reason){ toast('الرجاء تسجيل سبب الإرجاع'); return; }
    const returnItems = [];
    ov.querySelectorAll('.ret-qty').forEach(inp=>{
      const idx = Number(inp.dataset.idx);
      const qty = Math.round((parseFloat(inp.value)||0)*1000)/1000;
      if(qty>0){
        const r = rows[idx];
        returnItems.push({
          productId: r.productId, name: r.name, unit: r.unit, qty,
          price: r.price, cost: r.cost||0,
          refundAmount: Math.round(qty*unitRefund(r)*100)/100,
        });
      }
    });
    if(!returnItems.length){ toast('حدّد كمية واحدة على الأقل للإرجاع'); return; }

    const totalRefund = Math.round(returnItems.reduce((a,i)=>a+i.refundAmount,0)*100)/100;
    const ret = {
      id: uid(),
      saleId: sale.id,
      saleDate: sale.date,
      customerName: sale.customerName,
      date: new Date().toISOString(),
      items: returnItems,
      reason,
      totalRefund,
      processedBy: currentActorName(),
    };
    state.returns.push(ret);

    returnItems.forEach(ri=>{
      const p = state.products.find(pp=>pp.id===ri.productId);
      if(p){
        const prevStock = p.stock;
        const newStock = Math.round((prevStock+ri.qty)*1000)/1000;
        p.stock = newStock;
        logStockMove(p, STOCK_MOVE_TYPES.returned, ri.qty, prevStock, newStock);
      }
    });

    if(sale.paymentType==='credit' && sale.customerId){
      const cust = state.customers.find(x=>x.id===sale.customerId);
      if(cust){
        cust.balance = Math.max(0, Math.round(((cust.balance||0) - totalRefund)*100)/100);
        save('customers');
      }
    }

    save('returns'); save('products');
    ov.remove(); render();
    toast('تم تسجيل عملية الإرجاع بنجاح');
  };

  recalcRefund();
}

/* ============ الديون ============ */
function renderDebts(c){
  if(currentRole()==='cashier'){
    renderCustomerDebts(c);
    return;
  }
  const tabs = document.createElement('div');
  tabs.className = 'tabs';
  tabs.innerHTML = `
    <button class="tab-btn ${state.debtsTab==='customers'?'active':''}" id="tab-debt-cust">ديون العملاء</button>
    <button class="tab-btn ${state.debtsTab==='suppliers'?'active':''}" id="tab-debt-supp">ديون الموردين</button>`;
  c.appendChild(tabs);
  tabs.querySelector('#tab-debt-cust').onclick = ()=>{ state.debtsTab='customers'; render(); };
  tabs.querySelector('#tab-debt-supp').onclick = ()=>{ state.debtsTab='suppliers'; render(); };

  if(state.debtsTab==='suppliers') renderSupplierDebts(c);
  else renderCustomerDebts(c);
}

function renderCustomerDebts(c){
  const indebted = state.customers.filter(cu=>(cu.balance||0)>0);
  const totalDebt = indebted.reduce((a,cu)=>a+(cu.balance||0),0);

  const grid = document.createElement('div');
  grid.className = 'grid grid-4';
  grid.innerHTML = `
    <div class="stat-card brick"><div class="label">إجمالي الديون المستحقة</div><div class="value">${money(totalDebt)} د.ج</div></div>
    <div class="stat-card"><div class="label">عدد الزبائن المدينين</div><div class="value">${indebted.length}</div></div>
  `;
  c.appendChild(grid);

  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.style.marginTop = '18px';
  panel.innerHTML = `<h2>الزبائن الذين لديهم ديون</h2>` + (indebted.length ? `
    <table><thead><tr><th>الزبون</th><th>الهاتف</th><th>المبلغ المستحق</th><th></th></tr></thead>
    <tbody id="debt-tbody"></tbody></table>` : `<div class="empty">لا توجد ديون حالياً ✓</div>`);
  c.appendChild(panel);

  const tbody = document.getElementById('debt-tbody');
  if(tbody){
    indebted.sort((a,b)=>b.balance-a.balance).forEach(cu=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `<td><strong>${cu.name}</strong></td><td>${cu.phone||'—'}</td>
        <td><span class="debt-amount">${money(cu.balance)} د.ج</span></td>
        <td><button class="btn saffron small pay-debt">تسجيل دفعة</button></td>`;
      tr.querySelector('.pay-debt').onclick = ()=>openPaymentModal(cu);
      tbody.appendChild(tr);
    });
  }

  const histPanel = document.createElement('div');
  histPanel.className = 'panel';
  const hist = [...state.debtPayments].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
  histPanel.innerHTML = `<h2>آخر التسديدات</h2>` + (hist.length ? `
    <table><thead><tr><th>التاريخ</th><th>الزبون</th><th>المبلغ المسدد</th></tr></thead><tbody>

function isWithinLastDays(dateStr, days){
  const d = new Date(dateStr.slice(0,10));
  const from = new Date(); from.setHours(0,0,0,0); from.setDate(from.getDate()-(days-1));
  return d >= from;
}
function isSameMonth(dateStr){
  const d = new Date(dateStr);
  const t = new Date();
  return d.getFullYear()===t.getFullYear() && d.getMonth()===t.getMonth();
}
function isSameYear(dateStr){
  return new Date(dateStr).getFullYear() === new Date().getFullYear();
}

/* ============ الأرباح ============ */
/** تكلفة الصنف وقت البيع؛ للفواتير القديمة قبل تسجيل التكلفة، يُستخدم سعر تكلفة المنتج الحالي كأفضل تقدير متاح */
function itemCost(it){
  if(it.cost!==undefined && it.cost!==null) return it.cost;
  const p = state.products.find(pp=>pp.id===it.productId);
  return p ? p.cost : 0;
}

function salesRevenueInRange(predicateFn){
  return state.sales.filter(s=>predicateFn(s.date)).reduce((a,s)=>a+s.total,0);
}
function returnsRefundInRange(predicateFn){
  return state.returns.filter(r=>predicateFn(r.date)).reduce((a,r)=>a+r.totalRefund,0);
}
function returnsCostInRange(predicateFn){
  return state.returns.filter(r=>predicateFn(r.date)).reduce((a,r)=> a + r.items.reduce((aa,it)=>aa+it.qty*it.cost,0), 0);
}

function periodProfit(predicateFn){
  const salesInRange = state.sales.filter(s=>predicateFn(s.date));
  const grossRevenue = salesInRange.reduce((a,s)=>a+s.total,0);
  const grossCogs = salesInRange.reduce((a,s)=> a + s.items.reduce((aa,it)=> aa + it.qty*itemCost(it), 0), 0);
  const returnsRefund = returnsRefundInRange(predicateFn);
  const returnsCost = returnsCostInRange(predicateFn);
  const revenue = grossRevenue - returnsRefund;
  const cogs = grossCogs - returnsCost;
  const exp = state.expenses.filter(e=>predicateFn(e.date)).reduce((a,e)=>a+e.amount,0);
  return { revenue, cogs, exp, profit: revenue - cogs - exp };
}

function renderProfits(c){
  const todayP = periodProfit(d=>d.slice(0,10)===todayStr());
  const weekP = periodProfit(d=>isWithinLastDays(d,7));
  const monthP = periodProfit(isSameMonth);
  const yearP = periodProfit(isSameYear);
  const allP = periodProfit(()=>true);
  const margin = allP.revenue>0 ? (allP.profit/allP.revenue*100) : 0;

  const grid1 = document.createElement('div');
  grid1.className = 'grid grid-4';
  grid1.innerHTML = `

    <div class="stat-card ${yearP.profit<0?'brick':''}"><div class="label">ربح السنة</div><div class="value">${money(yearP.profit)} د.ج</div></div>
  `;
  c.appendChild(grid1);

  const grid2 = document.createElement('div');

  grid2.style.marginTop = '16px';
  grid2.innerHTML = `
    <div class="stat-card saffron"><div class="label">هامش الربح الإجمالي</div><div class="value">${margin.toFixed(1)}٪</div></div>
    <div class="stat-card"><div class="label">إجمالي المبيعات</div><div class="value">${money(allP.revenue)} د.ج</div></div>
    <div class="stat-card"><div class="label">تكلفة البضاعة المباعة</div><div class="value">${money(allP.cogs)} د.ج</div></div>
    <div class="stat-card"><div class="label">إجمالي المصاريف</div><div class="value">${money(allP.exp)} د.ج</div></div>
  `;
  c.appendChild(grid2);

  const qtyByProduct = {};
  const profitByProduct = {};
  state.sales.forEach(s=> s.items.forEach(it=>{
    qtyByProduct[it.name] = (qtyByProduct[it.name]||0) + it.qty;
    profitByProduct[it.name] = (profitByProduct[it.name]||0) + ((it.lineTotal!==undefined? it.lineTotal : it.price*it.qty) - itemCost(it)*it.qty);
  }));
  const topSelling = Object.entries(qtyByProduct).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const topProfit = Object.entries(profitByProduct).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const wrap = document.createElement('div');
  wrap.className = 'grid grid-2';
  wrap.style.marginTop = '18px';

  const sellPanel = document.createElement('div');
  sellPanel.className = 'panel';
  sellPanel.innerHTML = `<h2>الأكثر مبيعاً</h2>` + (topSelling.length ? `
    <table><thead><tr><th>المنتج</th><th>الكمية المباعة</th></tr></thead><tbody>
    ${topSelling.map(([name,qty])=>`<tr><td>${name}</td><td>${qty}</td></tr>`).join('')}
    </tbody></table>` : `<div class="empty">لا توجد بيانات كافية بعد</div>`);

  const profitPanel = document.createElement('div');
  profitPanel.className = 'panel';
  profitPanel.innerHTML = `<h2>الأكثر ربحاً</h2>` + (topProfit.length ? `
    <table><thead><tr><th>المنتج</th><th>الربح المحقق</th></tr></thead><tbody>
    ${topProfit.map(([name,pr])=>`<tr><td>${name}</td><td>${money(pr)} د.ج</td></tr>`).join('')}
    </tbody></table>` : `<div class="empty">لا توجد بيانات كافية بعد</div>`);
