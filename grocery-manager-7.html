      <button class="btn" id="add-contact">+ إضافة ${label}</button></div>
    ${list.length ? `<table><thead><tr><th>الاسم</th><th>الهاتف</th>${isCust?'<th>العنوان</th><th>الرصيد المستحق</th>':'<th>العنوان</th><th>الدين الحالي</th>'}<th></th></tr></thead><tbody id="contact-tbody"></tbody></table>`
      : `<div class="empty">لا يوجد ${label === 'عميل' ? 'عملاء' : 'موردون'} بعد</div>`}`;
  c.appendChild(panel);

  document.getElementById('add-contact').onclick = ()=>openContactModal(key);
  const tbody = document.getElementById('contact-tbody');
  if(tbody){
    list.forEach(item=>{
      const tr = document.createElement('tr');
      if(isCust){
        tr.innerHTML = `<td><strong>${item.name}</strong></td><td>${item.phone||'—'}</td><td>${item.address||'—'}</td>
          <td>${item.balance>0? `<span class="debt-amount">${money(item.balance)} د.ج</span>` : '—'}</td>
          <td style="white-space:nowrap;"><button class="btn ghost small view-c">التفاصيل</button> <button class="btn ghost small edit-c">تعديل</button> <button class="btn danger small del-c">حذف</button></td>`;
        tr.querySelector('.view-c').onclick = ()=>openCustomerDetail(item);
      } else {
        const stats = supplierStats(item.id);
        tr.innerHTML = `<td><strong>${item.name}</strong></td><td>${item.phone||'—'}</td><td>${item.address||'—'}</td>
          <td>${stats.remaining>0? `<span class="debt-amount">${money(stats.remaining)} د.ج</span>` : '—'}</td>
          <td style="white-space:nowrap;"><button class="btn ghost small view-c">التفاصيل</button> <button class="btn ghost small edit-c">تعديل</button> <button class="btn danger small del-c">حذف</button></td>`;
        tr.querySelector('.view-c').onclick = ()=>openSupplierDetail(item);
      }
      tr.querySelector('.edit-c').onclick = ()=>openContactModal(key, item);
      tr.querySelector('.del-c').onclick = ()=>{
        if(confirm(`حذف "${item.name}"؟`)){
          state[key] = state[key].filter(x=>x.id!==item.id);
          save(key); render();
        }
      };
      tbody.appendChild(tr);
    });
  }
}

function openContactModal(key, item){
  const isEdit = !!item;
  const isCust = key==='customers';
  const label = isCust ? 'عميل' : 'مورّد';
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `
    <div class="modal">
      <h3>${isEdit? 'تعديل '+label : 'إضافة '+label+' جديد'}</h3>
      <div class="field"><label>الاسم</label><input id="c-name" value="${item?.name||''}"></div>
      <div class="field"><label>رقم الهاتف</label><input id="c-phone" value="${item?.phone||''}"></div>
      <div class="field"><label>العنوان</label><input id="c-address" value="${item?.address||''}"></div>
      <div class="field"><label>ملاحظات</label><textarea id="c-notes" rows="2">${item?.notes||''}</textarea></div>
      <div class="modal-actions">
        <button class="btn" id="save-c">${isEdit?'حفظ':'إضافة'}</button>
        <button class="btn ghost" id="cancel-c">إلغاء</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  ov.querySelector('#cancel-c').onclick = ()=>ov.remove();
  ov.querySelector('#save-c').onclick = ()=>{
    const name = document.getElementById('c-name').value.trim();
    if(!name){ toast('الرجاء إدخال الاسم'); return; }
    const data = {
      name,
      phone: document.getElementById('c-phone').value.trim(),
      address: document.getElementById('c-address').value.trim(),
      notes: document.getElementById('c-notes').value.trim(),
    };
    if(isEdit) Object.assign(item, data);
    else state[key].push({id:uid(), balance: isCust?0:undefined, ...data});
    save(key); ov.remove(); render();
    toast(isEdit?'تم الحفظ':'تمت الإضافة');
  };
}

/* ---------- صفحة تفاصيل العميل ---------- */
function customerStats(customerId){
  const sales = state.sales.filter(s=>s.customerId===customerId).sort((a,b)=>b.date.localeCompare(a.date));
  const totalPurchases = sales.reduce((a,s)=>a+s.total,0);
  const payments = state.debtPayments.filter(p=>p.customerId===customerId).sort((a,b)=>b.date.localeCompare(a.date));
  return { sales, totalPurchases, invoiceCount: sales.length, payments };
}

function openCustomerDetail(cust){
  const { sales, totalPurchases, invoiceCount, payments } = customerStats(cust.id);
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `
    <div class="modal wide">
      <h3>${cust.name}</h3>
      <p style="color:var(--ink-muted); font-size:13px; margin-top:-10px;">
        ${cust.phone? '📞 '+cust.phone : ''} ${cust.address? '— 📍 '+cust.address : ''}
      </p>
      ${cust.notes? `<p style="font-size:13px; margin-top:-6px;"><strong>ملاحظات:</strong> ${cust.notes}</p>` : ''}

      <div class="grid grid-2" style="margin:14px 0;">
        <div class="stat-card ${cust.balance>0?'brick':''}"><div class="label">الرصيد المستحق</div><div class="value">${money(cust.balance||0)} د.ج</div></div>
        <div class="stat-card saffron"><div class="label">إجمالي المشتريات</div><div class="value">${money(totalPurchases)} د.ج</div></div>
      </div>
      <div class="summary-row" style="margin-bottom:10px;"><span>عدد الفواتير</span><span>${invoiceCount}</span></div>

      <h3 style="font-size:14px;">سجل المشتريات</h3>
      ${sales.length ? `<table class="mini-table"><thead><tr><th>رقم الفاتورة</th><th>التاريخ</th><th>المبلغ</th><th>الدفع</th></tr></thead>
      <tbody>${sales.slice(0,20).map(s=>`<tr><td>${s.invoiceNo?formatInvoiceNo(s.invoiceNo):'—'}</td><td>${new Date(s.date).toLocaleDateString('ar-DZ',{day:'2-digit',month:'2-digit',year:'numeric'})}</td><td>${money(s.total)} د.ج</td><td>${s.paymentType==='credit'?'بالدين':'نقدي'}</td></tr>`).join('')}</tbody></table>`
        : `<div class="empty">لا توجد مشتريات مسجلة بعد</div>`}

      <h3 style="font-size:14px; margin-top:14px;">سجل الدفعات</h3>
      ${payments.length ? `<table class="mini-table"><thead><tr><th>التاريخ</th><th>المبلغ المسدد</th></tr></thead>
      <tbody>${payments.map(p=>`<tr><td>${new Date(p.date).toLocaleDateString('ar-DZ',{day:'2-digit',month:'2-digit',year:'numeric'})}</td><td class="debt-row-clear">${money(p.amount)} د.ج</td></tr>`).join('')}</tbody></table>`
        : `<div class="empty">لا توجد دفعات مسجلة بعد</div>`}

      <div class="modal-actions"><button class="btn ghost" id="close-cust-detail">إغلاق</button></div>
    </div>`;
  document.body.appendChild(ov);
  ov.querySelector('#close-cust-detail').onclick = ()=>ov.remove();
}

/* ---------- صفحة تفاصيل المورد ---------- */
function openSupplierDetail(supplier){
  const stats = supplierStats(supplier.id);
  const purchases = state.purchases.filter(p=>p.supplierId===supplier.id).sort((a,b)=>b.date.localeCompare(a.date));
  const payments = state.supplierPayments.filter(p=>p.supplierId===supplier.id).sort((a,b)=>b.date.localeCompare(a.date));

  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `
    <div class="modal wide">
      <h3>${supplier.name}</h3>
      <p style="color:var(--ink-muted); font-size:13px; margin-top:-10px;">
        ${supplier.phone? '📞 '+supplier.phone : ''} ${supplier.address? '— 📍 '+supplier.address : ''}
      </p>
      ${supplier.notes? `<p style="font-size:13px; margin-top:-6px;"><strong>ملاحظات:</strong> ${supplier.notes}</p>` : ''}

      <div class="grid grid-4" style="margin:14px 0;">
        <div class="stat-card"><div class="label">إجمالي المشتريات</div><div class="value">${money(stats.totalPurchases)} د.ج</div></div>
        <div class="stat-card saffron"><div class="label">إجمالي المدفوع</div><div class="value">${money(stats.totalPaid)} د.ج</div></div>
        <div class="stat-card ${stats.remaining>0?'brick':''}"><div class="label">الدين الحالي</div><div class="value">${money(stats.remaining)} د.ج</div></div>
      </div>

      <h3 style="font-size:14px;">سجل المشتريات</h3>
      ${purchases.length ? `<table class="mini-table"><thead><tr><th>التاريخ</th><th>رقم فاتورة المورد</th><th>الإجمالي</th><th>المدفوع</th><th>المتبقي</th></tr></thead>
      <tbody>${purchases.map(p=>`<tr><td>${new Date(p.date).toLocaleDateString('ar-DZ',{day:'2-digit',month:'2-digit',year:'numeric'})}</td><td>${p.invoiceNumber||'—'}</td><td>${money(p.total)} د.ج</td><td>${money(p.paidAmount)} د.ج</td><td>${money(Math.max(0,p.total-p.paidAmount))} د.ج</td></tr>`).join('')}</tbody></table>`
        : `<div class="empty">لا توجد مشتريات مسجلة بعد</div>`}

      <h3 style="font-size:14px; margin-top:14px;">سجل الدفعات</h3>
      ${payments.length ? `<table class="mini-table"><thead><tr><th>التاريخ</th><th>المبلغ المسدد</th><th>ملاحظات</th></tr></thead>
      <tbody>${payments.map(p=>`<tr><td>${new Date(p.date).toLocaleDateString('ar-DZ',{day:'2-digit',month:'2-digit',year:'numeric'})}</td><td class="debt-row-clear">${money(p.amount)} د.ج</td><td>${p.notes||'—'}</td></tr>`).join('')}</tbody></table>`
        : `<div class="empty">لا توجد دفعات مسجلة بعد</div>`}

      <div class="modal-actions"><button class="btn ghost" id="close-supp-detail">إغلاق</button></div>
    </div>`;
  document.body.appendChild(ov);
  ov.querySelector('#close-supp-detail').onclick = ()=>ov.remove();
}

/* ============ الموظفون والصلاحيات ============ */
function renderEmployees(c){
  const note = document.createElement('div');
  note.className = 'panel';
  note.innerHTML = `<h2>الموظفون (${state.employees.length})</h2>
    <p style="color:var(--ink-muted); font-size:13px; margin:-6px 0 14px 0;">
      المدير يملك وصولاً كاملاً لكل الصفحات. الكاشير يمكنه فقط: نقطة البيع، الفواتير (بدون حذفها)، العملاء، تسجيل دفعات ديون العملاء، وعرض المنتجات (بدون حذف أو تعديل الأسعار) —
      ولا يمكنه رؤية الأرباح أو التقارير أو إدارة الموظفين أو ديون الموردين.
      يتطلب الدخول اختيار المستخدم وإدخال رمز PIN الخاص به؛ هذا تبديل صلاحيات محلي بسيط وليس نظام حماية أمني كامل.
    </p>
    <button class="btn" id="add-emp-btn">+ إضافة موظف</button>
    ${state.employees.length ? `<table style="margin-top:14px;"><thead><tr><th>الاسم</th><th>الدور</th><th>PIN</th><th></th></tr></thead>
    <tbody id="emp-tbody"></tbody></table>` : `<div class="empty">لا يوجد موظفون بعد — الوصول حالياً مفتوح بالكامل</div>`}`;
  c.appendChild(note);

  note.querySelector('#add-emp-btn').onclick = ()=>openEmployeeModal();
  const tbody = document.getElementById('emp-tbody');
  if(tbody){
    state.employees.forEach(emp=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `<td><strong>${emp.name}</strong></td><td><span class="badge ${emp.role==='admin'?'ok':'low'}">${emp.role==='admin'?'مدير':'كاشير'}</span></td>
        <td>${emp.pin? '••••' : '<span class="badge low">غير مفعّل</span>'}</td>
        <td style="white-space:nowrap;"><button class="btn ghost small edit-emp">تعديل</button> <button class="btn danger small del-emp">حذف</button></td>`;
      tr.querySelector('.edit-emp').onclick = ()=>openEmployeeModal(emp);
      tr.querySelector('.del-emp').onclick = ()=>{
        if(confirm(`حذف الموظف "${emp.name}"؟`)){
          state.employees = state.employees.filter(x=>x.id!==emp.id);
          if(state.currentEmployeeId===emp.id){ state.currentEmployeeId=null; saveCurrentEmployee(); }
          save('employees'); render();
        }
      };
      tbody.appendChild(tr);
    });
  }
}

function openEmployeeModal(emp){
  const isEdit = !!emp;
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `
    <div class="modal">
      <h3>${isEdit? 'تعديل موظف' : 'إضافة موظف جديد'}</h3>
      <div class="field"><label>الاسم</label><input id="e-name" value="${emp?.name||''}"></div>
      <div class="field"><label>الدور</label>
        <select id="e-role">
          <option value="cashier" ${emp?.role==='cashier'?'selected':''}>كاشير — صلاحيات محدودة</option>
          <option value="admin" ${emp?.role==='admin'?'selected':''}>مدير — وصول كامل</option>
        </select>
      </div>
      <div class="field"><label>رمز PIN (4 إلى 6 أرقام)${isEdit?' — اتركه فارغاً للإبقاء على الرمز الحالي':''}</label>
        <input id="e-pin" type="password" inputmode="numeric" maxlength="6" placeholder="****"></div>
      <div class="modal-actions">
        <button class="btn" id="save-emp">${isEdit?'حفظ':'إضافة'}</button>
        <button class="btn ghost" id="cancel-emp">إلغاء</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  ov.querySelector('#cancel-emp').onclick = ()=>ov.remove();
  ov.querySelector('#save-emp').onclick = ()=>{
    const name = document.getElementById('e-name').value.trim();
    if(!name){ toast('الرجاء إدخال اسم الموظف'); return; }
    const role = document.getElementById('e-role').value;
    const pinVal = document.getElementById('e-pin').value.trim();
    if(pinVal && !/^\d{4,6}$/.test(pinVal)){ toast('رمز PIN يجب أن يكون من 4 إلى 6 أرقام'); return; }
    if(!isEdit && !pinVal){ toast('الرجاء تعيين رمز PIN للموظف الجديد'); return; }
    const data = { name, role };
    if(pinVal) data.pin = pinVal;
    if(isEdit){ Object.assign(emp, data); }
    else state.employees.push({id:uid(), ...data});
    save('employees'); ov.remove(); render();
    toast(isEdit?'تم الحفظ':'تمت الإضافة');
  };
}

/* ============ بدء التشغيل ============ */
function showLoginGate(){
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `
    <div class="modal">
      <h3>تسجيل الدخول</h3>
      <div class="field"><label>اختر المستخدم</label>
        <select id="login-emp">${state.employees.map(e=>`<option value="${e.id}" ${e.id===state.currentEmployeeId?'selected':''}>${e.name} — ${e.role==='admin'?'مدير':'كاشير'}</option>`).join('')}</select>
      </div>
      <div class="field"><label>رمز PIN</label><input id="login-pin" type="password" inputmode="numeric" maxlength="6" placeholder="****"></div>
      <div class="modal-actions"><button class="btn" id="login-btn" style="width:100%; justify-content:center;">دخول</button></div>
    </div>`;
  document.body.appendChild(ov);
  const empSelect = ov.querySelector('#login-emp');
  const pinInput = ov.querySelector('#login-pin');
  function doLogin(){
    const emp = state.employees.find(x=>x.id===empSelect.value);
    if(!emp) return;
    if(emp.pin && pinInput.value!==emp.pin){ toast('رمز PIN غير صحيح'); pinInput.value=''; pinInput.focus(); return; }
    state.currentEmployeeId = emp.id;
    saveCurrentEmployee();
    ov.remove();
    render();
    logActivity('تسجيل الدخول', `دخول ${emp.name}`);
  }
  pinInput.onkeydown = (e)=>{ if(e.key==='Enter') doLogin(); };
  ov.querySelector('#login-btn').onclick = doLogin;
  pinInput.focus();
}

(async function init(){
  document.getElementById('content').innerHTML = `<div class="empty">جارِ تحميل البيانات...</div>`;
  await loadAll();
  if(state.employees.length){
    showLoginGate();
  } else {
    render();
  }
})();
</script>
</body>
</html>
